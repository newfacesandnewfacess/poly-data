<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>멀티 유튜브 플레이어 · Video Plane</title>
<style>
  :root{ --cols:1; }
  *{ box-sizing:border-box; }
  html,body{height:100%;margin:0;background:#111;color:#fff;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  body{overscroll-behavior:contain;}

  /* ===== 메인 그리드 (3 레이아웃) ===== */
  #videoGrid{
    position:fixed;inset:0;display:grid;gap:0;padding:0;width:100vw;height:100vh;
    /* 모바일 safe-area */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* 균등 레이아웃: 최대 3컬럼, 행 자동증가(스크롤) */
  #videoGrid.layout-eq2r{
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: auto;
    overflow:auto;
  }

  /* 포커스 + 사이드 (반응형 폭) */
  #videoGrid.layout-focus{
    grid-template-columns: minmax(0,1fr) minmax(240px, 360px);
    grid-template-rows: minmax(0,1fr);
    overflow:hidden;
  }
  .focus-main{ grid-column:1; grid-row:1; display:flex; height:100%; min-width:0; min-height:0; }
  .focus-side{
    grid-column:2; grid-row:1;
    display:flex; flex-direction:column; gap:12px; padding:8px;
    overflow-y:auto; max-height:100vh;
  }
  .focus-side .video-card{ height:33.33vh; min-height:180px; }

  /* 2×2: 셀을 꽉 채움(영상은 내부 레터박스) */
  #videoGrid.layout-2x2{
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    overflow:auto;
  }
  #videoGrid.layout-2x2 .video-card{ height:100%; }
  #videoGrid.layout-2x2 .player-shell{ width:100%; height:100%; flex:1 1 auto; min-height:0; aspect-ratio:auto; }

  /* ===== 카드/쉘/컨트롤 ===== */
  .video-card{
    display:flex; flex-direction:column; min-height:0;
    background:#000; width:100%; border:0;
    position:relative; z-index:3; /* plane(1) 위로 */
  }
  .player-shell{ background:#000; position:relative; z-index:4; min-width:0; }

  /* 균등 레이아웃은 16:9 비율로 높이 유지 */
  #videoGrid.layout-eq2r .player-shell{
    width:100%; aspect-ratio:16/9;
  }

  /* 포커스 메인은 남은 공간 모두 사용(비율 해제) */
  #videoGrid.layout-focus .focus-main .video-card{
    flex:1 1 auto; height:100%; min-height:0; width:100%;
  }
  #videoGrid.layout-focus .focus-main .player-shell{
    flex:1 1 auto; min-height:0; height:auto; aspect-ratio:auto;
  }
  /* 사이드 카드: 셀 꽉 채우기 */
  #videoGrid.layout-focus .focus-side .video-card .player-shell{
    flex:1 1 auto; min-height:0; height:auto; aspect-ratio:auto;
  }

  /* 영상 제목/채널 오버레이 */
  .card-meta{
    position:absolute; top:8px; left:8px; z-index:7;
    max-width:calc(100% - 16px);
    background:rgba(0,0,0,.65); color:#fff;
    font-size:12px; line-height:1.35;
    padding:4px 8px; border-radius:6px;
    pointer-events:none;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    display:none;
  }
  .card-meta::before{ content:"● "; color:#777; }
  .card-meta.playing::before{ color:#4caf50; }
  .card-meta b{ font-weight:600; }
  .card-meta .meta-author{ opacity:.78; }

  .btn{background:#222;border:1px solid #555;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
  .btn:hover{background:#2b2b2b}

  .vol-wrap{position:relative}
  .vol-pop{position:absolute;bottom:56px;right:0;background:#1e1e1e;border:1px solid #555;padding:8px 10px;border-radius:10px;display:none}
  .vol-pop.show{display:block}
  .vol-pop input[type=range]{width:160px}

  /* ===== 하단 포커스 위젯 (모든 레이아웃 공통) ===== */
  #focusWidget{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(8px + env(safe-area-inset-bottom));
    z-index:9000;
    display:none; align-items:center; gap:10px;
    background:rgba(20,20,20,.92);
    border:1px solid #444; border-radius:14px;
    padding:8px 12px;
    max-width: min(600px, calc(100vw - 16px));
    box-shadow:0 6px 24px rgba(0,0,0,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .fw-info{ display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto; }
  .fw-window{
    font-size:11px; font-weight:700; color:#a9c8ff; white-space:nowrap;
    background:#1c3252; border:1px solid #2f4a75; padding:2px 8px; border-radius:999px;
  }
  .fw-title{
    font-size:13px; color:#ddd; min-width:0;
    max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #focusWidget .fw-controls{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  #focusWidget #fwSeek{ width:130px; }

  /* 스크롤 레이아웃: 마지막 줄이 위젯에 가리지 않도록 여백 */
  #videoGrid.layout-eq2r{ padding-bottom: calc(env(safe-area-inset-bottom) + 72px); }

  /* 선택 테두리: 플레이어 영역만 둘러 컨트롤 가리지 않음 */
  .video-card.selected .player-shell::after{
    content:""; position:absolute; inset:0;
    border:4px solid #fff; border-radius:8px;
    pointer-events:none; z-index:6; box-sizing:border-box;
  }

  /* ===== 인트로 모달 ===== */
  #introModal{
    position:fixed; inset:0;
    background:rgba(0,0,0,.9);
    display:flex; justify-content:center; align-items:center;
    z-index:11000;
    overflow:auto;
    padding: max(24px, env(safe-area-inset-top))
             max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom))
             max(24px, env(safe-area-inset-left));
  }
  #introBox{
    background:#fff; color:#000; padding:20px; border-radius:12px;
    width:min(860px, 94vw);
    max-height: calc(100vh - 2*24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow:auto;
    box-sizing:border-box;
  }
  #urlRow{display:flex;gap:8px;align-items:center;margin:8px 0}
  #urlInput{flex:1;padding:8px;min-width:0}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{border:1px solid #ccc;padding:6px;text-align:center}
  td.url{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 레이아웃 픽커 */
  .layout-picker{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
  .layout-card{flex:1 1 180px;min-width:180px;max-width:260px;border:2px solid #ddd;border-radius:10px;padding:10px;cursor:pointer;user-select:none}
  .layout-card.active{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.25)}
  .layout-thumb{width:100%;height:120px;background:#f7f7f7;border-radius:8px;display:grid;place-items:center}
  .layout-caption{margin-top:8px;text-align:center;font-weight:600}
  .thumb-svg{width:100%;height:100%}

  /* ===== 영상 변경 모달 ===== */
  #changeModal{
    position:fixed; inset:0; z-index:12000;
    background:rgba(0,0,0,.78);
    display:none; justify-content:center; align-items:center;
    padding: max(16px, env(safe-area-inset-top))
             max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom))
             max(16px, env(safe-area-inset-left));
  }
  #changeBox{
    background:#1c1c1e; color:#fff; padding:18px; border-radius:12px;
    width:min(460px, 94vw); box-sizing:border-box;
    border:1px solid #333;
  }
  #changeBox h3{ margin:0 0 6px; font-size:16px; }
  .change-current{
    margin:0 0 12px; font-size:13px; color:#bbb; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #changeRow{ display:flex; gap:8px; }
  #changeInput{
    flex:1; min-width:0; padding:10px; border-radius:8px;
    border:1px solid #555; background:#111; color:#fff; font-size:14px;
  }
  #changeInput:focus{ outline:2px solid #0a84ff; border-color:transparent; }
  #changeInput.error{ outline:2px solid #ff453a; border-color:transparent; }
  .change-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .change-actions .btn-primary{
    background:#0a84ff; border:0; color:#fff;
    padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px;
  }

  /* ===== 샘플 선택 모달 ===== */
  #sampleModal{
    position:fixed; inset:0; z-index:12500;
    background:rgba(0,0,0,.78);
    display:none; justify-content:center; align-items:center;
    padding: max(16px, env(safe-area-inset-top))
             max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom))
             max(16px, env(safe-area-inset-left));
  }
  #sampleBox{
    background:#1c1c1e; color:#fff; padding:18px; border-radius:12px;
    width:min(760px, 96vw);
    border:1px solid #333;
    max-height: calc(100vh - 2*16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow:auto;
  }
  #sampleBox h3{ margin:0 0 4px; font-size:16px; }
  .sample-hint{ margin:0 0 10px; font-size:13px; color:#bbb; }
  #sampleGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .sample-card{
    position:relative; background:#111; border:2px solid #333;
    border-radius:10px; overflow:hidden; cursor:pointer; user-select:none;
  }
  .sample-card img{ width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .sample-card.sel{ border-color:#0a84ff; box-shadow:0 0 0 3px rgba(10,132,255,.35); }
  .sample-check{
    position:absolute; top:6px; right:6px; width:22px; height:22px;
    border-radius:50%; background:rgba(0,0,0,.6); border:2px solid #fff; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; opacity:0;
  }
  .sample-card.sel .sample-check{ opacity:1; background:#0a84ff; border-color:#0a84ff; }
  .sample-info{ padding:6px 8px 8px; }
  .sample-title{ font-size:12px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sample-author{ font-size:11px; color:#9a9a9a; margin-top:2px; }
  .sample-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .sample-count{ font-size:13px; color:#bbb; }
  .sample-actions .btn-primary{
    background:#0a84ff; border:0; color:#fff;
    padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px;
  }

  /* ===== Video Plane: 모든 iframe의 유일한 부모 ===== */
  .iframe-wrap{
    position:fixed; left:0; top:0; width:0; height:0;
    z-index:1;                /* 가장 아래 */
    pointer-events:none;      /* 선택된 것만 JS로 auto 전환 */
  }
  .iframe-wrap > div, .iframe-wrap iframe{
    width:100% !important; height:100% !important; display:block;
  }

  /* ===== 반응형: 가로(랜드스케이프) ===== */
  @media (max-width: 1200px){
    #videoGrid.layout-eq2r { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 900px) and (orientation: landscape){
    #videoGrid.layout-focus{ grid-template-columns: minmax(0,1fr) minmax(170px, 32vw); }
    #videoGrid.layout-focus .focus-side .video-card{ height:31vh; min-height:110px; }
  }
  @media (max-width: 720px){
    #videoGrid.layout-eq2r { grid-template-columns: 1fr; }
  }

  /* ===== 반응형: 세로(포터레이트) ===== */
  @media (max-width: 900px) and (orientation: portrait){
    /* 균등: 2열 */
    #videoGrid.layout-eq2r { grid-template-columns: repeat(2, 1fr); }

    /* 포커스: 메인 위 + 하단 가로 스트립 */
    #videoGrid.layout-focus{
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0,1fr) minmax(0, 34vh);
    }
    #videoGrid.layout-focus .focus-main{ grid-column:1; grid-row:1; height:100%; }
    #videoGrid.layout-focus .focus-side{
      grid-column:1; grid-row:2;
      flex-direction:row; overflow-x:auto; overflow-y:hidden;
      max-height:none; padding:6px; gap:8px;
    }
    #videoGrid.layout-focus .focus-side .video-card{
      width:min(46vw, 260px); height:auto; min-height:0; flex:0 0 auto;
    }
    #videoGrid.layout-focus .focus-side .video-card .player-shell{
      aspect-ratio:16/9; height:auto; flex:0 0 auto;
    }
    #videoGrid.layout-focus .focus-side .card-meta{ display:none; }

    /* 2×2: 2열 비율 유지 + 세로 스크롤 */
    #videoGrid.layout-2x2{
      grid-template-rows:none; grid-auto-rows:auto;
    }
    #videoGrid.layout-2x2 .video-card{ height:auto; }
    #videoGrid.layout-2x2 .player-shell{ aspect-ratio:16/9; height:auto; flex:0 0 auto; }
  }

  /* ===== 좁은 화면 컨트롤 ===== */
  @media (max-width: 720px){
    .btn{ padding:5px 8px; font-size:12px; border-radius:6px; }
    .vol-pop{ bottom:46px; padding:6px 8px; }
    .vol-pop input[type=range]{ width:120px; }
    .card-meta{ font-size:11px; padding:3px 6px; }
    #focusWidget{ padding:6px 10px; gap:8px; }
    #focusWidget #fwSeek{ width:64px; }
    .fw-title{ max-width:96px; font-size:12px; }
  }

  /* ===== 세로모드 안내 게이트(좁은 폰에서만, 무시 가능) ===== */
  #landscapeGate{
    position: fixed; inset: 0; z-index: 10000;
    display: none; align-items: center; justify-content: center;
    background: #000; color: #fff; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  #landscapeGate.show{ display:flex; }
  #landscapeGate .box{
    max-width: 520px; width: 100%;
    background: #141414; border:1px solid #333; border-radius: 12px;
    padding: 20px;
  }
  #landscapeGate h3{ margin:0 0 8px 0; }
  #landscapeGate p{ margin:0 0 16px 0; color:#cfcfcf; }
  #landscapeGate .gate-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #landscapeGate .btn-primary{
    background:#0a84ff; border:0; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer;
  }
  #landscapeGate .btn-secondary{
    background:#2a2a2a; border:1px solid #555; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer;
  }
</style>
</head>
<body>

<!-- 세로모드 안내 게이트(좁은 폰 세로일 때 표시, 무시 가능) -->
<div id="landscapeGate">
  <div class="box">
    <h3>가로 모드로 시청하세요</h3>
    <p>모바일 좁은 화면 세로 모드에선 가로(랜드스케이프)가 더 쾌적합니다. 가로로 전환하거나, 아래 버튼으로 세로 레이아웃을 그대로 사용할 수 있습니다.</p>
    <div class="gate-actions">
      <button class="btn-primary" onclick="forceLandscape()">가로모드로 보기</button>
      <button class="btn-secondary" onclick="dismissLandscape()">세로로 계속 보기</button>
    </div>
    <div style="margin-top:10px;font-size:12px;color:#9a9a9a">
      일부 브라우저(iOS Safari)는 버튼 대신 직접 기기를 가로로 돌려야 합니다.
    </div>
  </div>
</div>

<!-- 인트로 모달 -->
<div id="introModal">
  <div id="introBox">
    <h2>유튜브 주소 입력 & 레이아웃 선택</h2>

    <div id="urlRow">
      <input id="urlInput" type="text" placeholder="유튜브 주소(https://youtu.be/... 또는 ?v=...)" />
      <button class="btn" onclick="addUrl()">+ 추가</button>
      <button class="btn" onclick="startApp()">시작</button>
    </div>
    <div style="display:flex; gap:8px; margin:6px 0; flex-wrap:wrap;">
      <button class="btn" onclick="openSampleModal()">샘플에서 선택</button>
      <button class="btn" onclick="loadTrendingKR(6)">한국 인기영상 불러오기(베타)</button>
    </div>

    <div class="layout-picker">
      <div class="layout-card active" data-layout="eq2r" onclick="pickLayout(this)">
        <div class="layout-thumb">
          <svg class="thumb-svg" viewBox="0 0 300 160">
            <rect x="5" y="5" width="90" height="70" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="105" y="5" width="90" height="70" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="205" y="5" width="90" height="70" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="5" y="85" width="90" height="70" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="105" y="85" width="90" height="70" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="205" y="85" width="90" height="70" rx="10" stroke="#000" fill="none" stroke-width="4"/>
          </svg>
        </div>
        <div class="layout-caption">균등 (최대 3컬럼)</div>
      </div>

      <div class="layout-card" data-layout="focus" onclick="pickLayout(this)">
        <div class="layout-thumb">
          <svg class="thumb-svg" viewBox="0 0 300 160">
            <rect x="5" y="5" width="200" height="150" rx="12" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="215" y="10" width="80" height="45" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="215" y="58" width="80" height="45" rx="10" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="215" y="106" width="80" height="45" rx="10" stroke="#000" fill="none" stroke-width="4"/>
          </svg>
        </div>
        <div class="layout-caption">포커스 + 사이드</div>
      </div>

      <div class="layout-card" data-layout="2x2" onclick="pickLayout(this)">
        <div class="layout-thumb">
          <svg class="thumb-svg" viewBox="0 0 300 160">
            <rect x="5" y="5" width="140" height="70" rx="12" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="155" y="5" width="140" height="70" rx="12" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="5" y="85" width="140" height="70" rx="12" stroke="#000" fill="none" stroke-width="4"/>
            <rect x="155" y="85" width="140" height="70" rx="12" stroke="#000" fill="none" stroke-width="4"/>
          </svg>
        </div>
        <div class="layout-caption">2 × 2</div>
      </div>
    </div>

    <table id="urlTable">
      <thead><tr><th style="width:60px">순번</th><th style="width:100px">썸네일</th><th>주소</th><th style="width:80px">삭제</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 샘플 선택 모달 -->
<div id="sampleModal">
  <div id="sampleBox">
    <h3>샘플에서 선택</h3>
    <p class="sample-hint">원하는 영상을 골라 목록에 추가하세요. (제목은 자동으로 불러옵니다)</p>
    <div id="sampleGrid"></div>
    <div class="sample-actions">
      <button class="btn" onclick="toggleSelectAllSamples()">전체 선택/해제</button>
      <span id="sampleCount" class="sample-count">0개 선택</span>
      <span style="flex:1"></span>
      <button class="btn" onclick="closeSampleModal()">닫기</button>
      <button class="btn-primary" onclick="addSelectedSamples()">선택 추가</button>
    </div>
  </div>
</div>

<!-- 영상 변경 모달 (창별) -->
<div id="changeModal">
  <div id="changeBox">
    <h3 id="changeTitle">영상 변경</h3>
    <p class="change-current" id="changeCurrent"></p>
    <div id="changeRow">
      <input id="changeInput" type="text" placeholder="유튜브 주소 또는 영상 ID(11자)"
             oninput="this.classList.remove('error')"
             onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitChange(); }" />
    </div>
    <div class="change-actions">
      <button class="btn-primary" onclick="submitChange()">변경</button>
      <button class="btn" onclick="closeChangeModal()">취소</button>
    </div>
  </div>
</div>

<!-- 메인 그리드 -->
<div id="videoGrid" class="layout-eq2r"></div>

<!-- 하단 포커스 위젯: 현재 활성(포커스) 창의 컨트롤 (모든 레이아웃 공통) -->
<div id="focusWidget">
  <div class="fw-info">
    <span class="fw-window" id="fwWindow">창 1</span>
    <span class="fw-title" id="fwTitle">영상 로드 중…</span>
  </div>
  <div class="fw-controls">
    <input id="fwSeek" type="range" min="0" max="100" value="0" step="1" oninput="seekFocused(this.value)">
    <button id="fwPlay" class="btn" title="재생/일시정지 (Space)" onclick="toggleFocusedPlay()">▶</button>
    <button id="fwChange" class="btn" title="영상 변경 (현재 창)" onclick="openFocusedChange()">🔁</button>
    <div class="vol-wrap">
      <button id="fwMute" class="btn" title="음소거 (M)" onclick="toggleFocusedMute()">🔇</button>
      <div id="fwVolPop" class="vol-pop">
        <input id="fwVol" type="range" min="0" max="100" value="50" oninput="setFocusedVolume(this.value)">
      </div>
    </div>
  </div>
</div>

<!-- Video Plane: 모든 iframe 래퍼는 여기(부모 고정) -->
<div id="videoPlane"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ===== 상태 ===== */
let pending = [];
let players = [];            // YT.Player 인스턴스
let wraps   = [];            // 각 플레이어의 고정 래퍼(.iframe-wrap)
let videoCount = 0;
let currentLayout = 'eq2r';
let changeTarget = null;     // 영상 변경 모달이 가리키는 창 인덱스

/* ===== 유틸 ===== */
function extractVideoID(url){
  const m = (url||'').trim().match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== 모달 ===== */
function pickLayout(cardEl){
  document.querySelectorAll('.layout-card').forEach(el=>el.classList.remove('active'));
  cardEl.classList.add('active');
  currentLayout = cardEl.dataset.layout;
}

function addUrl(){
  const input = document.getElementById('urlInput');
  const url = input.value.trim();
  const id = extractVideoID(url);
  if(!id){ alert('유튜브 주소 형식이 아닙니다.'); return; }
  pending.push(url);
  input.value = '';
  renderPending();
}
function removePending(i){ pending.splice(i,1); renderPending(); }
function renderPending(){
  const tbody = document.querySelector('#urlTable tbody'); tbody.innerHTML='';
  pending.forEach((url,i)=>{
    const id = extractVideoID(url);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td><img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" width="80" height="45" style="object-fit:cover;border-radius:6px"/></td>
      <td class="url" title="${url}">${url}</td>
      <td><button class="btn" onclick="removePending(${i})">삭제</button></td>`;
    tbody.appendChild(tr);
  });
}

/* ==== 기본 샘플 영상 ==== */
const DEFAULT_VIDEO_IDS = [
  "M7lc1UVf-VE",
  "aqz-KE-bpKQ",
  "LXb3EKWsInQ",
  "ScMzIvxBSi4",
  "e-ORhEE9VVg",
  "kXYiU_JCYtU"
];
function useSampleDefaults(count=6){
  pending = DEFAULT_VIDEO_IDS.slice(0, count).map(id => `https://youtu.be/${id}`);
  renderPending();
}

/* ==== (선택) 한국 인기영상: YouTube Data API 필요 ==== */
const YT_API_KEY = ""; // 있으면 입력
async function loadTrendingKR(max=6){
  if(!YT_API_KEY){ useSampleDefaults(max); return; }
  try{
    const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=KR&maxResults=${max}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("YouTube API 요청 실패");
    const data = await res.json();
    const ids = (data.items||[]).map(it => it.id).filter(Boolean);
    if(ids.length === 0) throw new Error("인기영상을 찾지 못함");
    pending = ids.map(id => `https://youtu.be/${id}`);
    renderPending();
  }catch(err){
    console.warn("[Trending Fallback]", err);
    useSampleDefaults(max);
  }
}

/* 페이지 로드 시 비어있으면 샘플 채워 보여주기 */
window.addEventListener('load', ()=>{
  if(pending.length===0) useSampleDefaults(6);
});

/* ===== 시작 ===== */
function startApp(){
  if(pending.length===0){
    const fallback = document.getElementById('urlInput').value.trim();
    const id = extractVideoID(fallback);
    if(id) pending.push(fallback);
  }
  if(pending.length===0){ useSampleDefaults(6); }

  pending.forEach(url=>{
    const id = extractVideoID(url);
    if(id) createPlayer(id);
  });
  pending = []; renderPending();

  // 사용자 제스처 직후, 모두 음소거 재생(타임 유지용)
  setTimeout(()=>players.forEach(p=>{ try{ p.mute(); p.playVideo(); }catch(e){} }), 0);

  applyLayout();
  const first = document.querySelector('.video-card');
  if(first) selectCard(first);

  document.getElementById('introModal').style.display='none';
  updateOrientationGate();
}

/* ===== 레이아웃 ===== */
function ensureFocusPanes(){
  const grid = document.getElementById('videoGrid');
  let main = grid.querySelector('.focus-main');
  let side = grid.querySelector('.focus-side');
  if(!main){ main = document.createElement('div'); main.className='focus-main'; grid.appendChild(main); }
  if(!side){ side = document.createElement('div'); side.className='focus-side'; grid.appendChild(side); }
}
function unwrapFocus(){
  const grid = document.getElementById('videoGrid');
  const main = grid.querySelector('.focus-main');
  const side = grid.querySelector('.focus-side');
  if(main || side){
    const cards = [...grid.querySelectorAll('.video-card')];
    cards.forEach(c => grid.appendChild(c));
    main?.remove(); side?.remove();
  }
}
function applyLayout(){
  const grid = document.getElementById('videoGrid');
  grid.classList.remove('layout-eq2r','layout-focus','layout-2x2');

  if(currentLayout==='focus'){
    grid.classList.add('layout-focus');
    ensureFocusPanes();
    const main = grid.querySelector('.focus-main');
    const side = grid.querySelector('.focus-side');
    const cards = [...grid.querySelectorAll('.video-card')];
    if(cards.length){
      const selected = cards.find(c=>c.classList.contains('selected')) || cards[0];
      if(selected.parentNode!==main) main.appendChild(selected);
      cards.forEach(c=>{ if(c!==selected && c.parentNode!==side) side.appendChild(c); });
    }
    attachScrollSync(side); // 우측 스크롤시 좌표 동기화
  }else{
    unwrapFocus();
    if(currentLayout==='eq2r'){
      grid.classList.add('layout-eq2r');
      attachScrollSync(grid);
    }else{
      grid.classList.add('layout-2x2');
      attachScrollSync(grid);
    }
  }
  syncAll();
}

/* ===== Video Plane: 좌표 동기화 ===== */
function getShell(idx){ return document.getElementById(`shell${idx}`); }

function syncPos(idx){
  const shell = getShell(idx);
  const wrap  = wraps[idx];
  if(!shell || !wrap) return;
  const r = shell.getBoundingClientRect();
  wrap.style.left   = r.left + 'px';
  wrap.style.top    = r.top  + 'px';
  wrap.style.width  = r.width + 'px';
  wrap.style.height = (r.height - 1) + 'px'; // 경계 1px 여유(컨트롤과 겹침 방지)
}
function syncAll(){ for(let i=0;i<players.length;i++) syncPos(i); }

/* 스크롤/리사이즈/레이아웃 변화 시 rAF로 동기화 */
let syncScheduled = false;
function requestSync(){ if(syncScheduled) return; syncScheduled = true; requestAnimationFrame(()=>{ syncScheduled=false; syncAll(); }); }
window.addEventListener('resize', requestSync, {passive:true});
window.addEventListener('orientationchange', ()=> setTimeout(requestSync, 250));
const _scrollTargets = new WeakSet();
function attachScrollSync(el){
  if(!el || _scrollTargets.has(el)) return;
  el.addEventListener('scroll', requestSync, {passive:true});
  _scrollTargets.add(el);
}
/* 레이아웃 변화(컬럼/폭 변경 등)도 감지 */
const _resizeObs = (typeof ResizeObserver !== 'undefined') ? new ResizeObserver(()=>requestSync()) : null;
if(_resizeObs) _resizeObs.observe(document.getElementById('videoGrid'));

/* ===== 플레이어 생성 ===== */
function createPlayer(videoId){
  const idx = videoCount;

  // 1) 카드 + player-shell (좌표 기준만 제공)
  const card = document.createElement('div');
  card.className='video-card';
  card.dataset.idx = idx;
  card.onclick = ()=>selectCard(card);
  card.innerHTML = `
    <div class="card-meta" id="meta${idx}"></div>
    <div class="player-shell" id="shell${idx}"></div>`;
  const grid = document.getElementById('videoGrid');
  if(currentLayout==='focus'){
    ensureFocusPanes();
    grid.querySelector('.focus-side').appendChild(card);
  }else{
    grid.appendChild(card);
  }

  // 2) Video Plane 래퍼 + mount (iframe의 유일한 부모)
  const wrap = document.createElement('div');
  wrap.className = 'iframe-wrap';
  wrap.id = `wrap${idx}`;
  const mount = document.createElement('div'); // YT.Player mount
  mount.id = `mount${idx}`;
  wrap.appendChild(mount);
  document.body.appendChild(wrap);
  wraps[idx] = wrap;

  // 3) YT.Player 생성 (mount에 붙임)
  players[idx] = new YT.Player(mount, {
    videoId,
    playerVars:{ playsinline:1, rel:0, modestbranding:1, iv_load_policy:3, autoplay:1 },
    events:{ onReady:onPlayerReady, onStateChange:onPlayerStateChange }
  });

  videoCount++;
  if(_resizeObs){ _resizeObs.observe(card); _resizeObs.observe(document.getElementById(`shell${idx}`)); }
  applyLayout();
  requestSync();
}

/* ===== 선택/인터랙션 ===== */
function setInteractable(idx, enabled){
  const wrap = wraps[idx];
  if(wrap) wrap.style.pointerEvents = enabled ? 'auto' : 'none';
}
function selectCard(card){
  document.querySelectorAll('.video-card').forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  const selectedIdx = Number(card.dataset.idx);

  // 재생 유지 + 소리만 끔, 선택만 조작 허용
  players.forEach((p,i)=>{ if(p?.mute) p.mute(); setInteractable(i, i===selectedIdx); });

  if(currentLayout==='focus'){
    const grid  = document.getElementById('videoGrid');
    ensureFocusPanes();
    const main  = grid.querySelector('.focus-main');
    const side  = grid.querySelector('.focus-side');
    const curMain = main.querySelector('.video-card');

    if(curMain !== card){
      if(curMain) side.prepend(curMain);      // 기존 포커스는 사이드 상단
      if(card.parentNode !== main) main.appendChild(card);
    }
    attachScrollSync(side);
  }

  // 선택된 것만 언뮤트
  const sel = players[selectedIdx];
  if(sel?.unMute){ sel.unMute(); }

  updateWidget();
  requestSync();
}

/* ===== YT 콜백/컨트롤 ===== */
function onPlayerReady(e){
  const p = e.target;
  const idx = players.indexOf(p);
  try{ p.mute(); p.playVideo(); }catch(_){}   // 모두 음소거 자동재생
  setInteractable(idx, false);

  // UI 갱신 루프 (카드 메타 + 포커스 위젯)
  setInterval(()=>{
    const dur = p.getDuration ? p.getDuration() : 0;
    const cur = p.getCurrentTime ? p.getCurrentTime() : 0;
    if(idx === getSelectedIdx()){
      updateFwSeek(idx, dur, cur);
      updateFwPlayUI(idx);
      updateFwAudioUI(idx);
    }
    updateMeta(idx);
  }, 500);

  requestSync();
}
function onPlayerStateChange(e){
  // 필요 시 상태 기반 처리 가능
}

/* ===== 영상 정보 오버레이 (제목/채널명, API 키 불필요) ===== */
function updateMeta(idx){
  const el = document.getElementById(`meta${idx}`);
  const p = players[idx];
  if(!el || !p || typeof p.getVideoData !== 'function'){ if(el) el.style.display='none'; return; }
  let title='', author='';
  try{ const d = p.getVideoData()||{}; title = d.title||''; author = d.author||''; }catch(_){}
  if(!title){ el.style.display='none'; el.classList.remove('playing'); return; }
  el.style.display = '';
  el.innerHTML = `<b>${escapeHtml(title)}</b>${author ? `<span class="meta-author"> · ${escapeHtml(author)}</span>` : ''}`;
  let st = -1;
  try{ st = typeof p.getPlayerState === 'function' ? p.getPlayerState() : -1; }catch(_){}
  el.classList.toggle('playing', st===1);
}

function ensureSelected(idx){
  const card = document.querySelector(`.video-card[data-idx="${idx}"]`);
  if(card && !card.classList.contains('selected')) selectCard(card);
}
function togglePlay(idx){
  ensureSelected(idx);
  const p = players[idx]; if(!p) return;
  const st = p.getPlayerState?.();
  (st===1 ? p.pauseVideo() : p.playVideo());
  updateFwPlayUI(idx);
}
function toggleMute(idx){
  ensureSelected(idx);
  const p = players[idx]; if(!p) return;
  (p.isMuted() ? p.unMute() : p.mute());
  updateFwAudioUI(idx, true);
}
function setVolume(idx, v){
  const p = players[idx]; if(!p) return;
  p.setVolume(Number(v));
  if(p.getVolume()===0 && !p.isMuted()) p.mute();
  if(p.getVolume()>0 && p.isMuted()) p.unMute();
  updateFwAudioUI(idx);
}
function seekVideo(idx, v){
  ensureSelected(idx);
  const p = players[idx]; if(!p) return;
  p.seekTo(Number(v), true);
}

/* ===== 하단 포커스 위젯 ===== */
function getSelectedIdx(){
  const card = document.querySelector('.video-card.selected');
  return card ? Number(card.dataset.idx) : -1;
}
function updateWidget(){
  const idx = getSelectedIdx();
  const w = document.getElementById('focusWidget');
  if(idx<0 || !players[idx]){ if(w) w.style.display='none'; return; }
  if(w) w.style.display='flex';
  document.getElementById('fwWindow').textContent = `창 ${idx+1}`;
  const p = players[idx];
  let label = '';
  if(p && typeof p.getVideoData === 'function'){
    try{
      const d = p.getVideoData()||{};
      if(d.title) label = `${d.title}${d.author ? ` · ${d.author}` : ''}`;
    }catch(_){}
  }
  const titleEl = document.getElementById('fwTitle');
  titleEl.textContent = label || '영상 로드 중…';
  titleEl.title = label;
  updateFwPlayUI(idx);
  updateFwAudioUI(idx);
}
function updateFwSeek(idx, dur, cur){
  const seek = document.getElementById('fwSeek');
  if(!seek || !players[idx]) return;
  if(dur){ seek.max = dur; seek.value = cur; }
}
function updateFwPlayUI(idx){
  const p = players[idx], btn = document.getElementById('fwPlay');
  if(!p || !btn || !p.getPlayerState) return;
  btn.textContent = p.getPlayerState()===1 ? '⏸' : '▶';
  btn.title = p.getPlayerState()===1 ? '일시정지 (Space)' : '재생 (Space)';
}
function updateFwAudioUI(idx, fromToggle=false){
  const p = players[idx];
  const btn = document.getElementById('fwMute');
  const pop = document.getElementById('fwVolPop');
  const vr  = document.getElementById('fwVol');
  if(!p || !btn || !pop || !vr || !p.getVolume) return;
  const audible = !p.isMuted() && p.getVolume()>0;
  btn.textContent = audible ? '🔊' : '🔇';
  btn.title = audible ? '음소거 (M)' : '음소거 해제 (M)';
  if(audible){ if(fromToggle) pop.classList.add('show'); vr.value = p.getVolume(); }
  else pop.classList.remove('show');
}
function seekFocused(v){ const idx = getSelectedIdx(); if(idx>=0) seekVideo(idx, v); }
function toggleFocusedPlay(){ const idx = getSelectedIdx(); if(idx>=0) togglePlay(idx); }
function toggleFocusedMute(){ const idx = getSelectedIdx(); if(idx>=0) toggleMute(idx); }
function setFocusedVolume(v){ const idx = getSelectedIdx(); if(idx>=0) setVolume(idx, v); }
function openFocusedChange(){ const idx = getSelectedIdx(); if(idx>=0) openChangeModal(idx); }

/* ===== 영상 변경 (창별) ===== */
function openChangeModal(idx){
  changeTarget = idx;
  const p = players[idx];
  let label = `창 ${idx+1}`;
  if(p && typeof p.getVideoData === 'function'){
    try{
      const d = p.getVideoData()||{};
      if(d.title) label = `${d.title}${d.author ? ` · ${d.author}` : ''}`;
    }catch(_){}
  }
  document.getElementById('changeTitle').textContent = `영상 변경 (창 ${idx+1})`;
  document.getElementById('changeCurrent').textContent = `현재: ${label}`;
  const inp = document.getElementById('changeInput');
  inp.value=''; inp.classList.remove('error');
  document.getElementById('changeModal').style.display='flex';
  setTimeout(()=>inp.focus(), 60);
}
function closeChangeModal(){
  document.getElementById('changeModal').style.display='none';
  changeTarget = null;
}
function submitChange(){
  if(changeTarget==null) return;
  const raw = document.getElementById('changeInput').value.trim();
  const id = extractVideoID(raw) || (raw.match(/^[a-zA-Z0-9_-]{11}$/) ? raw : null);
  if(!id){
    const inp = document.getElementById('changeInput');
    inp.classList.add('error'); inp.focus();
    return;
  }
  const p = players[changeTarget];
  if(!p){ closeChangeModal(); return; }
  try{ p.loadVideoById(id); }catch(e){ console.warn('loadVideoById 실패:', e); }
  updateMeta(changeTarget);
  updateWidget();
  requestSync();
  closeChangeModal();
}
/* 모달 배경 클릭 닫기 */
document.getElementById('changeModal').addEventListener('click', e=>{
  if(e.target === document.getElementById('changeModal')) closeChangeModal();
});

/* ===== 샘플 선택 모달 ===== */
let sampleSelected = new Set();
function openSampleModal(){
  sampleSelected.clear();
  renderSampleGrid();
  document.getElementById('sampleModal').style.display='flex';
}
function closeSampleModal(){
  document.getElementById('sampleModal').style.display='none';
}
function renderSampleGrid(){
  const grid = document.getElementById('sampleGrid');
  grid.innerHTML='';
  DEFAULT_VIDEO_IDS.forEach(id=>{
    const card = document.createElement('div');
    card.className='sample-card';
    card.dataset.id = id;
    card.innerHTML = `
      <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"/>
      <div class="sample-check">✓</div>
      <div class="sample-info">
        <div class="sample-title">제목 불러오는 중…</div>
        <div class="sample-author"></div>
      </div>`;
    card.onclick = ()=>toggleSample(card);
    grid.appendChild(card);
    fetchSampleTitle(id, card);
  });
  updateSampleCount();
}
function toggleSample(card){
  card.classList.toggle('sel');
  if(card.classList.contains('sel')) sampleSelected.add(card.dataset.id);
  else sampleSelected.delete(card.dataset.id);
  updateSampleCount();
}
function toggleSelectAllSamples(){
  const cards = [...document.querySelectorAll('#sampleGrid .sample-card')];
  const all = cards.length>0 && cards.every(c=>c.classList.contains('sel'));
  cards.forEach(c=>{
    c.classList.toggle('sel', !all);
    if(!all) sampleSelected.add(c.dataset.id); else sampleSelected.delete(c.dataset.id);
  });
  updateSampleCount();
}
function updateSampleCount(){
  document.getElementById('sampleCount').textContent = `${sampleSelected.size}개 선택`;
}
function addSelectedSamples(){
  if(sampleSelected.size===0){ alert('샘플을 하나 이상 선택해 주세요.'); return; }
  sampleSelected.forEach(id=>{
    const url = `https://youtu.be/${id}`;
    if(!pending.some(u=>extractVideoID(u)===id)) pending.push(url);
  });
  renderPending();
  sampleSelected.clear();
  closeSampleModal();
}
/* oEmbed JSONP로 제목/채널명 가져오기 (API 키 불필요) */
function fetchSampleTitle(id, cardEl){
  const t = cardEl.querySelector('.sample-title');
  const a = cardEl.querySelector('.sample-author');
  const cb = 'ytOembedCb_' + id.replace(/[^a-zA-Z0-9]/g,'');
  window[cb] = (data)=>{
    if(data && data.title){ t.textContent = data.title; t.title = data.title; }
    if(data && data.author_name) a.textContent = data.author_name;
    delete window[cb];
  };
  const s = document.createElement('script');
  s.src = `https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v='+id)}&format=json&callback=${cb}`;
  s.onerror = ()=>{ t.textContent = id; delete window[cb]; };
  document.head.appendChild(s);
  setTimeout(()=>{
    if(t.textContent.includes('불러오는 중')){ t.textContent = id; delete window[cb]; }
  }, 8000);
}
/* 모달 배경 클릭 닫기 */
document.getElementById('sampleModal').addEventListener('click', e=>{
  if(e.target === document.getElementById('sampleModal')) closeSampleModal();
});

/* ===== 포커스 사용성: 키보드 단축키 ===== */
function modalsOpen(){
  const intro = document.getElementById('introModal');
  if(intro && intro.style.display !== 'none') return true;
  const chg = document.getElementById('changeModal');
  if(chg && chg.style.display === 'flex') return true;
  const smp = document.getElementById('sampleModal');
  if(smp && smp.style.display === 'flex') return true;
  return false;
}
function focusNext(delta){
  const cards = [...document.querySelectorAll('.video-card')];
  if(!cards.length) return;
  const cur = cards.findIndex(c=>c.classList.contains('selected'));
  const next = (cur===-1 ? 0 : (cur+delta+cards.length)%cards.length);
  selectCard(cards[next]);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeChangeModal(); closeSampleModal(); return; }
  if(modalsOpen()) return;
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const cards = [...document.querySelectorAll('.video-card')];
  if(!cards.length) return;
  const cur = cards.findIndex(c=>c.classList.contains('selected'));
  const selIdx = cur>=0 ? Number(cards[cur].dataset.idx) : -1;

  switch(e.key){
    case 'ArrowRight': case 'ArrowDown': e.preventDefault(); focusNext(1); break;
    case 'ArrowLeft':  case 'ArrowUp':   e.preventDefault(); focusNext(-1); break;
    case ' ': e.preventDefault(); if(selIdx>=0) togglePlay(selIdx); break;
    case 'm': case 'M': if(selIdx>=0) toggleMute(selIdx); break;
    default:
      const n = parseInt(e.key, 10);
      if(!isNaN(n) && n>=1 && n<=cards.length){ e.preventDefault(); selectCard(cards[n-1]); }
  }
});

/* ===== 포커스 사용성: 모바일 스와이프(다음/이전 창) ===== */
let _touch = {x:0, y:0, active:false};
const _gridEl = document.getElementById('videoGrid');
_gridEl.addEventListener('touchstart', e=>{
  if(!e.touches.length || modalsOpen()){ _touch.active=false; return; }
  _touch = { x:e.touches[0].clientX, y:e.touches[0].clientY, active:true };
}, {passive:true});
_gridEl.addEventListener('touchend', e=>{
  if(!_touch.active) return;
  _touch.active=false;
  if(!e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - _touch.x;
  const dy = e.changedTouches[0].clientY - _touch.y;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.2){
    dx < 0 ? focusNext(1) : focusNext(-1);
  }
}, {passive:true});

/* ===== 세로모드 안내 게이트 (좁은 폰에서만, 무시 가능) ===== */
function updateOrientationGate(){
  const gate = document.getElementById('landscapeGate');
  const introOpen = document.getElementById('introModal')?.style.display !== 'none';
  const dismissed = sessionStorage.getItem('landscapeDismissed') === '1';
  const narrow = window.innerWidth <= 700;
  const portrait = window.matchMedia("(orientation: portrait)").matches;
  if(!introOpen && !dismissed && narrow && portrait) gate.classList.add('show');
  else gate.classList.remove('show');
}
function dismissLandscape(){
  sessionStorage.setItem('landscapeDismissed', '1');
  updateOrientationGate();
}
async function forceLandscape(){
  try{
    const el = document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  }catch(e){
    console.warn('orientation lock 실패:', e);
  }finally{
    updateOrientationGate();
  }
}
window.addEventListener('load', updateOrientationGate);
window.addEventListener('resize', updateOrientationGate);
window.addEventListener('orientationchange', updateOrientationGate);
try{ window.matchMedia("(orientation: portrait)").addEventListener('change', updateOrientationGate); }catch(_){}

/* ===== 팝오버 닫기 ===== */
document.addEventListener('click',(e)=>{
  document.querySelectorAll('.vol-pop').forEach(el=>{
    if(!el.contains(e.target) && !el.previousElementSibling.contains(e.target)) el.classList.remove('show');
  });
});
</script>
