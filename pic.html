<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>이미지 → 프롬프트 (UMD 빌드)</title>
<script src="./lib/transformers.min.js"></script>
<style>
  :root{--bg:#0b1220;--fg:#e9eef6;--acc:#7bdcff}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:sans-serif}
  .wrap{max-width:900px;margin:32px auto;padding:16px}
  .card{background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px}
  #preview{width:100%;max-height:420px;object-fit:contain;background:#111;border-radius:10px}
  textarea{width:100%;min-height:240px;background:#0b1220;color:#e9eef6;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px}
  button{background:var(--acc);border:none;color:#001825;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;align-items:center;justify-content:center;flex-direction:column;color:white}
  .spinner{border:6px solid rgba(255,255,255,0.2);border-top:6px solid var(--acc);border-radius:50%;width:60px;height:60px;animation:spin 1s linear infinite;margin-bottom:15px}
  @keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>이미지 → 프롬프트</h1>
  <div class="card">
    <input id="file" type="file" accept="image/*"/>
    <div style="margin-top:12px"><img id="preview" alt=""></div>
    <p id="facts"></p>
    <button id="run">캡션+프롬프트 생성</button>
    <h3>프롬프트</h3>
    <textarea id="prompt"></textarea>
  </div>
</div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-text">처리 중...</div>
</div>

<script>
const $file=document.getElementById('file');
const $img=document.getElementById('preview');
$file.onchange=()=>{ const f=$file.files?.[0]; if(!f) return; $img.src=URL.createObjectURL(f); };

function showOverlay(msg){ 
  document.getElementById('overlay').style.display="flex"; 
  document.getElementById('overlay-text').innerText=msg; 
}
function hideOverlay(){ document.getElementById('overlay').style.display="none"; }

let pipe=null;
document.getElementById('run').onclick=async()=>{
  if(!$img.src){ alert('이미지를 먼저 선택'); return; }
  const w=$img.naturalWidth||$img.width, h=$img.naturalHeight||$img.height;
  showOverlay("모델 로딩 중...");

  if(!pipe){
    const { pipeline } = window.transformers;
    pipe = await pipeline("image-to-text", "nlpconnect/vit-gpt2-image-captioning");
  }
  showOverlay("캡션 생성 중...");
  const out = await pipe($img);
  hideOverlay();

  const caption = out?.[0]?.generated_text || "A detailed scene";
  document.getElementById('facts').innerText = "완료";
  document.getElementById('prompt').value = `주제/구도: ${caption}\n해상도: ${w}×${h}px`;
};
</script>
</body>
</html>
