<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PDF → 이미지 추출 (최소 패치)</title>

<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/pyscript.css"/>
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<py-config>{ "packages": ["pypdf"] }</py-config>

<style>
  body{margin:0;background:#0b1220;color:#e9eef6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:980px;margin:40px auto;padding:0 16px}
  .card{background:#121a2a;border:1px solid #223;padding:18px;border-radius:14px}
  button{padding:10px 14px;border-radius:10px;border:1px solid #334;background:#1a2236;color:#e9eef6;cursor:pointer}
  input[type=file]{display:none}
  #gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
  #gallery img{max-width:100%;border-radius:10px;border:1px solid #334;background:#0f1525}
  pre{white-space:pre-wrap;background:#0f1525;border:1px solid #334;border-radius:10px;padding:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>PDF → 이미지 추출 (pypdf)</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button py-click="pick_pdf">PDF 선택</button>
      <button py-click="clear_all">지우기</button>
      <a id="ziplink" style="display:none" download="images.zip">ZIP 다운로드</a>
    </div>
    <input id="pdfinput" type="file" accept="application/pdf"/>
    <div id="gallery"></div>
    <h3>로그</h3><pre id="log"></pre>
  </div>
</div>

<script type="py">
from pyscript import display, when
from js import document, Uint8Array
import io, base64, zipfile, traceback

def lg(m): display(str(m), target="log", append=True)
def set_html(id_, html): document.getElementById(id_).innerHTML = html
def append_html(id_, html): document.getElementById(id_).insertAdjacentHTML("beforeend", html)

def pick_pdf(e=None): document.getElementById("pdfinput").click()
def clear_all(e=None):
    set_html("gallery",""); document.getElementById("ziplink").style.display="none"
    document.getElementById("log").innerText=""

async def file_to_bytes(f):
    ab = await f.arrayBuffer()
    return bytes(Uint8Array.new(ab))  # ← 확실한 Python bytes

@when("change","#pdfinput")
async def on_pdf(e):
    try:
        files = e.target.files
        if not files or files.length==0:
            lg("파일 선택 취소\n"); return
        f = files[0]; lg(f"선택됨: {f.name} ({f.size} bytes)\n")

        pdf_bytes = await file_to_bytes(f)

        from pypdf import PdfReader
        reader = PdfReader(io.BytesIO(pdf_bytes))

        images=[]
        for pno, page in enumerate(reader.pages, start=1):
            imgs = getattr(page, "images", None)
            if imgs is None:
                raise RuntimeError("사용 중 pypdf에서 page.images를 찾지 못했습니다. 최신 pypdf 권장.")
            for idx, im in enumerate(imgs, start=1):
                ext = (im.extension or "bin").lower()
                mime = {"jpg":"jpeg","jpeg":"jpeg","jp2":"jp2","png":"png","tiff":"tiff"}.get(ext, "octet-stream")
                fname = f"p{pno:03d}_{idx:02d}.{ext}"
                images.append((fname, f"image/{mime}", im.data))

        if not images:
            lg("이미지 없음\n"); return

        set_html("gallery","")
        for fname, mime, data in images:
            b64 = base64.b64encode(data).decode("ascii")
            append_html("gallery", f'<figure><img alt="{fname}" src="data:{mime};base64,{b64}"><figcaption style="opacity:.85">{fname}</figcaption></figure>')

        bio = io.BytesIO()
        with zipfile.ZipFile(bio, "w", zipfile.ZIP_DEFLATED) as z:
            for fname, _, data in images:
                z.writestr(fname, data)
        a = document.getElementById("ziplink")
        a.href = "data:application/zip;base64," + base64.b64encode(bio.getvalue()).decode("ascii")
        a.style.display = "inline-block"
        lg(f"총 {len(images)}개 이미지 추출 완료\n")
    except Exception as ex:
        lg("[에러]\n" + "".join(traceback.format_exception_only(type(ex),ex)))
</script>
</body>
</html>
