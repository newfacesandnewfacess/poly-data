<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PDF → 이미지 추출 (권장)</title>

<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/pyscript.css"/>
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>

<py-config>{ "packages": ["pypdf"] }</py-config>

<style>
  body{margin:0;background:#0b1220;color:#e9eef6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:1100px;margin:40px auto;padding:0 16px}
  .card{background:#121a2a;border:1px solid #223;padding:18px;border-radius:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{padding:10px 14px;border-radius:10px;border:1px solid #334;background:#1a2236;color:#e9eef6;cursor:pointer}
  input[type=file]{display:none}
  input[type=text]{background:#0f1525;border:1px solid #334;border-radius:10px;color:#e9eef6;padding:8px 10px}
  #gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
  #gallery figure{margin:0}
  #gallery img{max-width:100%;border-radius:12px;border:1px solid #334;background:#0f1525}
  #stats{opacity:.85}
  pre{white-space:pre-wrap;background:#0f1525;border:1px solid #334;border-radius:10px;padding:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>PDF → 이미지 추출 (pypdf)</h1>
    <div class="row">
      <button py-click="pick_pdf">PDF 선택</button>
      <label>페이지 범위(예: 1-3, 5): <input id="range" type="text" placeholder="비우면 전체"/></label>
      <button py-click="clear_all">지우기</button>
      <a id="ziplink" style="display:none" download="images.zip">ZIP 다운로드</a>
    </div>
    <div id="stats"></div>
    <input id="pdfinput" type="file" accept="application/pdf"/>
    <div id="gallery"></div>
    <h3>로그</h3><pre id="log"></pre>
  </div>
</div>

<script type="py">
from pyscript import display, when
from js import document, TextDecoder, Uint8Array
import io, base64, zipfile, traceback

def lg(m): display(str(m), target="log", append=True)
def set_html(id_, html): document.getElementById(id_).innerHTML = html
def append_html(id_, html): document.getElementById(id_).insertAdjacentHTML("beforeend", html)

def pick_pdf(e=None): document.getElementById("pdfinput").click()
def clear_all(e=None):
    set_html("gallery",""); set_html("stats","")
    document.getElementById("ziplink").style.display="none"
    document.getElementById("log").innerText=""

def parse_range(s, total):
    # "1-3,5" → {1,2,3,5}; 1-based
    s = (s or "").strip()
    if not s: return set(range(1, total+1))
    out = set()
    for part in s.split(","):
        part = part.strip()
        if "-" in part:
            a,b = part.split("-",1)
            if a.isdigit() and b.isdigit():
                i,j = int(a), int(b)
                if i<=j: out.update(range(max(1,i), min(total,j)+1))
        elif part.isdigit():
            k = int(part)
            if 1<=k<=total: out.add(k)
    return out

async def file_to_bytes(f):
    ab = await f.arrayBuffer()
    return bytes(Uint8Array.new(ab))

@when("change","#pdfinput")
async def on_pdf(e):
    try:
        files = e.target.files
        if not files or files.length==0:
            lg("파일 선택 취소\n"); return
        f = files[0]
        lg(f"선택됨: {f.name} ({f.size} bytes)\n")

        from pypdf import PdfReader
        pdf_bytes = await file_to_bytes(f)
        reader = PdfReader(io.BytesIO(pdf_bytes))
        total_pages = len(reader.pages)
        wanted = parse_range(document.getElementById("range").value, total_pages)
        if not wanted: lg("선택된 페이지가 없습니다.\n"); return

        images = []
        skipped = 0
        for pno, page in enumerate(reader.pages, start=1):
            if pno not in wanted: continue
            imgs = getattr(page, "images", None)
            if imgs is None:
                raise RuntimeError("현재 pypdf에서 page.images를 찾지 못했습니다. pypdf 최신 버전 사용을 권장합니다.")
            if not imgs:
                skipped += 1; continue
            for idx, im in enumerate(imgs, start=1):
                ext = (im.extension or "bin").lower()
                mime = {"jpg":"jpeg","jpeg":"jpeg","jp2":"jp2","png":"png","tiff":"tiff"}.get(ext, "octet-stream")
                fname = f"p{pno:03d}_{idx:02d}.{ext}"
                images.append((fname, f"image/{mime}", im.data, len(im.data)))

        if not images:
            set_html("stats", f"<div id='stats'>선택한 구간에 추출 가능한 이미지가 없습니다. (빈 페이지: {skipped})</div>")
            lg("이미지 없음\n"); return

        set_html("gallery","")
        for fname, mime, data, n in images:
            b64 = base64.b64encode(data).decode("ascii")
            append_html("gallery", f'<figure><img alt="{fname}" src="data:{mime};base64,{b64}"><figcaption style="opacity:.85">{fname} · {n} bytes</figcaption></figure>')

        # ZIP
        bio = io.BytesIO()
        with zipfile.ZipFile(bio, "w", zipfile.ZIP_DEFLATED) as z:
            for fname, _, data, _ in images:
                z.writestr(fname, data)
        zip_b64 = base64.b64encode(bio.getvalue()).decode("ascii")
        a = document.getElementById("ziplink")
        a.href = "data:application/zip;base64," + zip_b64
        a.style.display = "inline-block"

        set_html("stats", f"<div id='stats'>총 {len(images)}개 이미지 추출 · 건너뜀 {skipped} 페이지</div>")
        lg("완료\n")
    except Exception as ex:
        lg("[에러]\n" + "".join(traceback.format_exception_only(type(ex),ex)))
</script>
</body>
</html>
