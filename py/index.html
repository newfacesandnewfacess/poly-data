<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PyScript · 로컬 .py 실행(진단 강화)</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css"/>
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<py-config>{ "packages": [] }</py-config>
<style>
  body{margin:0;background:#0b1220;color:#e9eef6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:980px;margin:40px auto;padding:0 16px}
  .card{background:#121a2a;border:1px solid #223;padding:18px;border-radius:14px}
  button{padding:10px 14px;border-radius:10px;border:1px solid #334;background:#1a2236;color:#e9eef6;cursor:pointer}
  input[type=file]{display:none}
  pre{white-space:pre-wrap;background:#0f1525;border:1px solid #334;border-radius:10px;padding:10px;margin-top:10px}
  #out{min-height:96px} #log{min-height:56px;opacity:.85}
  .ok{color:#9BE28A}.warn{color:#FFC66D}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div id="env"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
    <button py-click="open_picker">파일 열기 → 실행</button>
    <button py-click="clear_all">모두 지우기</button>
  </div>
  <input id="picker" type="file" accept=".py,.txt"/>
  <h3>출력</h3><pre id="out"></pre>
  <h3>로그</h3><pre id="log"></pre>
</div></div>

<script type="py">
from pyscript import display, when
from pyodide.ffi import create_proxy, to_py
from js import document, window
import sys, io, traceback, re

def w(m): display(str(m), target="out", append=True)
def lg(m): display(str(m), target="log", append=True)

# 환경 배너
host = window.location.hostname or ""
ok_env = (".github.io" in host) or (host == "localhost")
document.getElementById("env").innerHTML = (
  f'<b class="ok">✅ Pages/로컬 환경:</b> {host}' if ok_env
  else f'<b class="warn">⚠️ Pages 아님:</b> {host} — github.io 주소로 여세요'
)

# window.onerror → 로그로
def _onerr(ev):
    try:
        msg = getattr(ev, "message", None) or "unknown"
        lg(f"[window.onerror] {msg}\n")
    except Exception: pass
window.addEventListener("error", create_proxy(_onerr))

# 숨은 문자 정규화
UNSAFE = {"\u00A0":"NBSP","\u202F":"NARROW_NBSP","\u2007":"FIGURE_SPACE",
          "\u200B":"ZWSP","\u200C":"ZWNJ","\u200D":"ZWJ","\u2060":"WORD_JOINER","\uFEFF":"BOM"}
_pattern = re.compile("[" + "".join(UNSAFE.keys()) + "]")
def sanitize(src:str):
    cnt={}
    def repl(m):
        ch=m.group(0); cnt[ch]=cnt.get(ch,0)+1
        return " " if ch in ("\u00A0","\u202F","\u2007") else ""
    return _pattern.sub(repl, src), cnt

def open_picker(e=None):
    lg("open_picker\n")
    document.getElementById("picker").click()

@when("change","#picker")
async def on_change(e):
    lg("change 수신\n")
    files = e.target.files
    await run_selected(files)

async def run_selected(files):
    if not files or files.length==0:
        lg("파일 없음/취소\n"); return
    f = files[0]; lg(f"선택됨: {f.name} ({f.size} bytes)\n")
    try:
        # text() 실패 대비: ArrayBuffer Fallback
        try:
            code = await f.text()
        except Exception as e_text:
            lg(f"text() 실패 → arrayBuffer(): {e_text}\n")
            ab = await f.arrayBuffer()
            code = bytes(to_py(ab)).decode("utf-8","replace")

        code, cnt = sanitize(code)
        if cnt:
            lg("[정규화] " + ", ".join(f"{UNSAFE[k]}×{v}" for k,v in cnt.items()) + "\n")

        buf=io.StringIO(); old=sys.stdout; sys.stdout=buf
        ret=None
        try:
            ns={}; exec(code, ns, ns)
            if "main" in ns and callable(ns["main"]): ret=ns["main"]()
        finally:
            sys.stdout=old
        out=buf.getvalue()
        w(f"▶ {f.name}\n")
        if out: w(f"[print]\n{out}")
        if ret is not None: w(f"[main()]\n{ret}\n")
        if not out and ret is None: w("[안내] 출력/반환 없음\n")
    except Exception as e:
        w("[에러]\n" + "".join(traceback.format_exception_only(type(e),e)))

def clear_all(e=None):
    document.getElementById("out").innerText=""
    document.getElementById("log").innerText=""

# 이중 바인딩
try:
    document.getElementById("picker").addEventListener("change", create_proxy(on_change))
    lg("수동 바인딩 완료\n")
except Exception:
    lg("수동 바인딩 실패(무시)\n")

lg("READY\n")
</script>
</body></html>
