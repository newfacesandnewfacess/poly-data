<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="robots" content="noindex, nofollow">
	<meta name="type" content="website">
	<meta name="title" content="새해 복 많이 받으세요">
	<meta name="description" content="새해 복 많이 받으세요">
	<meta name="image" content="http://honam.or.kr/2026/img/card.jpg">
	<meta property="og:type" content="website">
	<meta property="og:title" content="새해 복 많이 받으세요">
	<meta property="og:description" content="새해 복 많이 받으세요">
	<meta property="og:image" content="http://honam.or.kr/2026/img/card.jpg">
	<meta itemprop="image" content="http://honam.or.kr/2026/img/card.jpg">
    
    
    <title>2026 Happy New Year</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        canvas { display: block; }
        
        #audio-status {
            position: fixed; bottom: 20px; right: 20px;
            color: rgba(212, 175, 55, 0.6); font-size: 11px; z-index: 5;
            pointer-events: none;
        }

        /* 안내 문구 박스 */
        #guide-overlay {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .guide-box {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #fff;
            padding: 10px 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: bounce 2s infinite;
        }
        .guide-text-top { font-size: 15px; font-weight: 700; color: #d4af37; margin-bottom: 2px; }
        .guide-text-bottom { font-size: 13px; font-weight: 400; opacity: 0.9; }

        /* 답장하기 버튼 (명칭 변경 및 노출 타이밍 최적화) */
        #reply-button {
            position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%) translateY(30px);
            z-index: 20; opacity: 0; visibility: hidden;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff; border: none; padding: 15px 45px;
            border-radius: 50px; font-size: 17px; font-weight: 700;
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        #reply-button.visible {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }
        #reply-button:active { transform: translateX(-50%) scale(0.96); opacity: 0.9; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <div id="guide-overlay">
        <div class="guide-box">
            <div class="guide-text-top">2026년의 문을 열어봐요</div>
            <div class="guide-text-bottom">화면을 위로 슬라이드 하세요</div>
        </div>
    </div>

    <!-- 버튼 명칭 변경: 답장하기 -->
    <button id="reply-button" onclick="sendReply()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        답장하기
    </button>

    <div id="audio-status">화면을 터치하면 음악이 시작됩니다</div>
    <canvas id="cardCanvas"></canvas>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        const guideOverlay = document.getElementById('guide-overlay');
        const replyBtn = document.getElementById('reply-button');

        let width, height, startY = 0, startProgress = 0, isDragging = false, progress = 0;
        let animationId = null;
        let audioContext = null;
        let isAudioStarted = false;

        const bgImage = new Image();
        const backgroundImages = [
            "http://honam.or.kr/2026/img/card1.jpg",
            "http://honam.or.kr/2026/img/card2.jpg",
            "http://honam.or.kr/2026/img/card3.jpg",
            "http://honam.or.kr/2026/img/card4.jpg"
        ];

        function initBackground() {
            const randomIndex = Math.floor(Math.random() * backgroundImages.length);
            bgImage.src = backgroundImages[randomIndex];
            bgImage.onload = () => { resize(); render(); };
            bgImage.onerror = () => { useFallbackBackground(); };
        }

        function useFallbackBackground() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 1024; tempCanvas.height = 1024;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = "#111";
            tCtx.fillRect(0, 0, 1024, 1024);
            tCtx.fillStyle = "#d4af37";
            tCtx.font = "bold 140px serif";
            tCtx.textAlign = "center";
            tCtx.fillText("2026", 512, 540);
            bgImage.src = tempCanvas.toDataURL();
        }

        const cardW = 310;
        const cardContent = {
            title: "2026 謹賀新年",
            subtitle: "붉은말을 타고 내일을 준비",
            body: [
                "새해에는 계획하신 모든 일이", 
                "지혜롭게 이루어지길 기원합니다.", 
                "", 
                "지금보다 더 좋은 미래를 위해", 
                "당신의 힘찬 걸음에 세상도 같이", 
                "움직이는 한 해", 
                "되시길 기원합니다.", 
                "", 
                "박재성 올림"
            ]
        };
        const lineHeight = 24;
        const calculatedCardH = 180 + (cardContent.body.length * lineHeight);
        const envW = 340;
        const envH = calculatedCardH + 40; 

        function sendReply() {
            const phoneNumber = "010-7445-0512"; // 실제 수신 번호로 변경 필요
            const message = "정성스러운 새해 카드 잘 보았습니다. 감사합니다! 2026년 새해 복 많이 받으세요.";
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            const separator = isIOS ? '&' : '?';
            const smsUrl = `sms:${phoneNumber}${separator}body=${encodeURIComponent(message)}`;
            window.location.href = smsUrl;
        }

        function initAudio() {
            if (isAudioStarted) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            isAudioStarted = true;
            document.getElementById('audio-status').innerText = "2026년 새해 복 많이 받으세요";
            playTheme();
        }

        function playTheme() {
            const scale = [261.63, 329.63, 392.00, 440.00, 523.25];
            let step = 0;
            function playNote(freq, time, duration, vol) {
                if(!audioContext) return;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(vol, time + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start(time);
                osc.stop(time + duration);
            }
            function loop() {
                if (!isAudioStarted || !audioContext) return;
                const now = audioContext.currentTime;
                if (step % 8 === 0) playNote(scale[0]/2, now, 2, 0.08);
                if (Math.random() > 0.4) playNote(scale[Math.floor(Math.random()*scale.length)], now, 1.5, 0.04);
                step++;
                setTimeout(loop, 450);
            }
            loop();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            render();
        }

        function getMap(val, start, end, targetStart, targetEnd) {
            const p = Math.min(Math.max((val - start) / (end - start), 0), 1);
            return targetStart + p * (targetEnd - targetStart);
        }

        function render() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, width, height);
            
            if (progress > 0.05) {
                guideOverlay.style.opacity = "0";
            } else {
                guideOverlay.style.opacity = "1";
            }

            // 노출 타이밍 조정: 진행률이 98% 이상일 때만 버튼 출현
            if (progress > 0.98) {
                replyBtn.classList.add('visible');
            } else {
                replyBtn.classList.remove('visible');
            }

            const openP = getMap(progress, 0, 0.45, 0, 1.2);
            const curtainOffset = (width / 2) * openP;

            if (bgImage.complete && bgImage.src) {
                const scale = Math.max(width / bgImage.width, height / bgImage.height);
                const dw = bgImage.width * scale;
                const dh = bgImage.height * scale;
                const dx = (width - dw) / 2;
                const dy = (height - dh) / 2;

                ctx.save();
                ctx.beginPath();
                ctx.rect(0 - curtainOffset, 0, width/2, height);
                ctx.clip();
                ctx.drawImage(bgImage, dx - curtainOffset, dy, dw, dh);
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(width/2 - 2 - curtainOffset, 0, 2, height);
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.rect(width/2 + curtainOffset, 0, width/2, height);
                ctx.clip();
                ctx.drawImage(bgImage, dx + curtainOffset, dy, dw, dh);
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(width/2 + curtainOffset, 0, 2, height);
                ctx.restore();
            }

            const centerX = width / 2;
            const centerY = height / 2 + 10;
            const globalVisibleP = getMap(progress, 0.1, 0.4, 0, 1);

            if (globalVisibleP > 0) {
                const dropP = getMap(progress, 0.65, 1.0, 0, 1);
                const envY = centerY + (dropP * height * 0.5);
                const cardRiseP = getMap(progress, 0.7, 1.0, 0, 1);
                const targetCardY = height * 0.15 + (calculatedCardH / 2);
                const cardYBase = centerY + (dropP * height * 0.1);
                const cardY = cardYBase - (cardRiseP * (cardYBase - targetCardY));

                ctx.save();
                ctx.globalAlpha = globalVisibleP;
                ctx.fillStyle = "#7a1212";
                ctx.beginPath();
                ctx.roundRect(centerX - envW/2, envY - envH/2, envW, envH, 10);
                ctx.fill();

                if (getMap(progress, 0.5, 0.7, 0, 1) > 0) {
                    ctx.save();
                    ctx.globalAlpha = getMap(progress, 0.5, 0.7, 0, 1);
                    ctx.fillStyle = "#fffef0";
                    ctx.shadowBlur = 20; ctx.shadowColor = "rgba(0,0,0,0.3)";
                    ctx.beginPath();
                    ctx.roundRect(centerX - cardW/2, cardY - calculatedCardH/2, cardW, calculatedCardH, 8);
                    ctx.fill();
                    ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 2;
                    ctx.strokeRect(centerX - cardW/2 + 8, cardY - calculatedCardH/2 + 8, cardW - 16, calculatedCardH - 16);
                    ctx.textAlign = "center";
                    ctx.fillStyle = "#111"; ctx.font = "bold 22px serif";
                    ctx.fillText(cardContent.title, centerX, cardY - calculatedCardH/2 + 55);
                    ctx.fillStyle = "#b00"; ctx.font = "bold 15px sans-serif";
                    ctx.fillText(cardContent.subtitle, centerX, cardY - calculatedCardH/2 + 85);
                    ctx.fillStyle = "#333";
                    cardContent.body.forEach((line, idx) => {
                        const ty = cardY - calculatedCardH/2 + 130 + (idx * lineHeight);
                        ctx.font = line.includes("호남직업전문학교") ? "bold 15px sans-serif" : "14px sans-serif";
                        ctx.fillText(line, centerX, ty);
                    });
                    ctx.restore();
                }

                ctx.save();
                ctx.globalAlpha = globalVisibleP * getMap(progress, 0.9, 1.0, 1, 0.2);
                ctx.fillStyle = "#a01515";
                ctx.beginPath();
                ctx.moveTo(centerX - envW/2, envY - envH/2);
                ctx.lineTo(centerX, envY + 30);
                ctx.lineTo(centerX + envW/2, envY - envH/2);
                ctx.lineTo(centerX + envW/2, envY + envH/2);
                ctx.lineTo(centerX - envW/2, envY + envH/2);
                ctx.closePath();
                ctx.fill();

                if(getMap(progress, 0.4, 0.6, 1, 0) > 0) {
                    ctx.save();
                    ctx.globalAlpha = getMap(progress, 0.4, 0.6, 1, 0);
                    ctx.fillStyle = "#d4af37";
                    ctx.beginPath(); ctx.arc(centerX, envY, 30, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = "bold 24px serif"; ctx.textAlign = "center";
                    ctx.fillText("福", centerX, envY + 10);
                    ctx.restore();
                }
                ctx.restore();
                ctx.restore();
            }

            ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(0,0,width,4);
            ctx.fillStyle = "#d4af37"; ctx.fillRect(0,0,width*progress,4);
        }

        function animateTo(target) {
            const step = () => {
                const diff = target - progress;
                if (Math.abs(diff) < 0.001) { progress = target; render(); animationId = null; return; }
                progress += diff * 0.1;
                render();
                animationId = requestAnimationFrame(step);
            };
            animationId = requestAnimationFrame(step);
        }

        function startDrag(y) {
            if (animationId) cancelAnimationFrame(animationId);
            initAudio();
            isDragging = true; startY = y; startProgress = progress;
        }

        canvas.addEventListener('touchstart', e => startDrag(e.touches[0].clientY));
        canvas.addEventListener('touchmove', e => {
            if (!isDragging) return;
            progress = Math.min(Math.max(startProgress + (startY - e.touches[0].clientY)/400, 0), 1);
            render();
        }, { passive: false });
        canvas.addEventListener('touchend', () => {
            isDragging = false;
            let t = progress > 0.8 ? 1.0 : (progress > 0.45 ? 0.6 : (progress > 0.15 ? 0.3 : 0));
            animateTo(t);
        });

        canvas.addEventListener('mousedown', e => startDrag(e.clientY));
        window.addEventListener('mousemove', e => {
            if (isDragging) {
                progress = Math.min(Math.max(startProgress + (startY - e.clientY)/400, 0), 1);
                render();
            }
        });
        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                let t = progress > 0.8 ? 1.0 : (progress > 0.45 ? 0.6 : (progress > 0.15 ? 0.3 : 0));
                animateTo(t);
            }
        });

        window.addEventListener('resize', resize);
        window.onload = initBackground;
    </script>
</body>
</html>
